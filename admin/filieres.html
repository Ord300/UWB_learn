<body class="index-page">
<header id="header" class="header d-flex align-items-center sticky-top">
<div class="container position-relative d-flex align-items-center justify-content-between">

<main class="main">
<section class="section pt-4"><div class="container" data-aos="fade-up">
<div class="role-hero role-admin" data-aos="fade-up" data-aos-delay="100">
<div class="d-flex align-items-center gap-3 flex-wrap">
<span class="role-avatar"><i class="bi bi-diagram-3"></i></span>
<div><span class="hero-pill"><i class="bi bi-gear"></i> Module Filières</span>
<h2>Gérer les filières</h2>
<p class="mb-0">Créez les filières utilisées pour les comptes étudiants & enseignants.</p></div>
</div></div>
<div class="stats-grid cols-3 mt-4" id="kpi" data-aos="fade-up" data-aos-delay="150"></div>
</div></section>
<section class="portfolio section light-background">
<div class="container"><div class="search-pro mb-4" data-aos="fade-up">
<div class="pro-row">
<div class="pro-input"><i class="bi bi-search"></i><input id="q" placeholder="Nom ou code… Ex : info" aria-label="Rechercher une filière" oninput="uwbSearchType(this);render()"><button type="button" class="pro-clear" title="Effacer" onclick="uwbSearchClear('q',render)"><i class="bi bi-x-lg"></i></button></div>
</div>
<div class="pro-row pro-tags"><span id="f-count"></span><button type="button" class="pro-tag" onclick="openFiliereModal()">+ Nouvelle filière</button></div>
</div>
<div class="d-flex justify-content-end mb-3" data-aos="fade-up"><button class="btn-uwb" onclick="openFiliereModal()"><i class="bi bi-plus-circle"></i> Ajouter une filière</button></div>
<div class="panel-pro" data-aos="fade-up"><div class="panel-head"><strong><i class="bi bi-collection"></i> Filières</strong><small id="f-count2"></small></div><div id="frows"></div></div></div></section>
</main>
<div class="modal fade" id="filiereModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content" style="border-radius:18px;overflow:hidden"><div class="p-3 p-md-4"><div class="d-flex justify-content-between align-items-center mb-2"><strong><i class="bi bi-diagram-3"></i> <span id="f-title">Ajouter une filière</span></strong><button type="button" class="icon-btn danger" data-bs-dismiss="modal" aria-label="Fermer"><i class="bi bi-x-lg"></i></button></div>
<form onsubmit="return saveFiliere(event)" class="row g-3 form-min"><input type="hidden" id="fid"><div class="col-md-7"><label class="form-label">Nom *</label><input id="fnom" class="form-control" placeholder="Ex : Informatique" required></div>
<div class="col-md-5"><label class="form-label">Code *</label><input id="fcode" class="form-control" placeholder="Ex : INFO" required></div>
<div class="col-12"><label class="form-label">Description</label><input id="fdesc" class="form-control" placeholder="Courte description…"></div>
<div class="col-12 d-flex gap-2"><button class="btn-uwb"><i class="bi bi-check"></i> Enregistrer</button><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fermer</button></div></form>
</div></div></div></div>
<footer id="footer" class="footer light-background"><div class="container footer-bottom"><div class="copyright"><p>© UWB E-learning — Filières. Design : <a href="https://bootstrapmade.com/">BootstrapMade (Orbit)</a>.</p></div></div></footer>
<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a><div id="preloader"></div>
<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/vendor/aos/aos.js"></script><script src="../assets/vendor/glightbox/js/glightbox.min.js"></script>
<script src="../assets/vendor/isotope-layout/isotope.pkgd.min.js"></script><script src="../assets/vendor/imagesloaded/imagesloaded.pkgd.min.js"></script>
<script src="../assets/vendor/purecounter/purecounter_vanilla.js"></script><script src="../assets/vendor/swiper/swiper-bundle.min.js"></script>
<script src="../assets/js/script.js"></script><script>
const s=uwbRequire(['admin']); let db=uwbLoad();
function render(){db=uwbLoad();if(!db.filieres)db.filieres=[];
const q=(document.getElementById('q').value||'').toLowerCase().trim();
const f=db.filieres.filter(x=>!q||(x.nom+' '+x.code+' '+(x.description||'')).toLowerCase().includes(q));
const ratt=db.users.filter(u=>u.filiere&&u.filiere!=='—').length;
const kpis=[['bi-diagram-3',db.filieres.length,'Filières','stat-card-primary'],['bi-people',ratt,'Comptes rattachés',''],['bi-person-x',db.users.filter(u=>!u.filiere||u.filiere==='—').length,'Sans filière','stat-card-accent']];
document.getElementById('kpi').innerHTML=kpis.map(([ic,v,t,c],i)=>`<div class="stat-card ${c}" data-aos="zoom-in" data-aos-delay="${300+i*50}"><div class="stat-icon-wrap"><i class="bi ${ic}"></i></div><div class="stat-info"><span class="stat-value">${v}</span><span class="stat-title">${t}</span></div></div>`).join('');
document.getElementById('f-count').textContent=f.length+' filière(s) trouvée(s)';
document.getElementById('f-count2').textContent=db.filieres.length+' filière(s)';
document.getElementById('frows').innerHTML=f.map(fl=>{const nb=db.users.filter(u=>u.filiere===fl.nom).length;return `<div class="mini-row"><div style="min-width:0;flex:1"><strong>${fl.nom}</strong> <span class="mini-badge">${fl.code||''}</span><br><small>${fl.description||'—'}</small><br><small class="text-truncate d-block">${nb} compte(s) rattaché(s)</small></div><div class="mini-actions"><button class="icon-btn" title="Modifier" onclick="editFiliere('${fl.id}')"><i class="bi bi-pencil"></i></button><button class="icon-btn danger" title="Supprimer" onclick="delFiliere('${fl.id}')"><i class="bi bi-trash"></i></button></div></div>`;}).join('')||'<p class="text-muted small mb-0">Aucune filière. Ajoutez la première ci-dessus.</p>';}
function openFiliereModal(){document.getElementById('fid').value='';document.getElementById('f-title').textContent='Ajouter une filière';new bootstrap.Modal(document.getElementById('filiereModal')).show();}
function editFiliere(id){const l=db.filieres.find(x=>x.id===id);if(!l)return;document.getElementById('fid').value=l.id;document.getElementById('fnom').value=l.nom;document.getElementById('fcode').value=l.code||'';document.getElementById('fdesc').value=l.description||'';document.getElementById('f-title').textContent='Modifier : '+l.nom;new bootstrap.Modal(document.getElementById('filiereModal')).show();}
function saveFiliere(e){e.preventDefault();const d=uwbLoad();if(!d.filieres)d.filieres=[];const id=document.getElementById('fid').value;const data={nom:document.getElementById('fnom').value.trim(),code:document.getElementById('fcode').value.trim(),description:document.getElementById('fdesc').value.trim()};if(!data.nom||!data.code){alert('Nom et code requis.');return false;}
if(id){const l=d.filieres.find(x=>x.id===id);if(l)Object.assign(l,data);}else{if(d.filieres.some(x=>x.code.toLowerCase()===data.code.toLowerCase())){alert('Code déjà utilisé.');return false;}d.filieres.push(Object.assign({id:'f'+Date.now()},data));}uwbSave(d);const m=document.getElementById('filiereModal');const inst=bootstrap.Modal.getInstance(m);if(inst)inst.hide();e.target.reset();render();return false;}
function delFiliere(id){const d=uwbLoad();const fl=(d.filieres||[]).find(x=>x.id===id);const nb=d.users.filter(u=>u.filiere===(fl?fl.nom:''));if(nb.length&&!confirm(nb.length+' compte(s) utilisent cette filière. Supprimer quand même ?'))return;if(!nb.length&&!confirm('Supprimer cette filière ?'))return;d.filieres=(d.filieres||[]).filter(x=>x.id!==id);uwbSave(d);render();}
render();
</script></body></html>
