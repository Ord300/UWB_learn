<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Mes cours & séances Meet — UWB Learn</title><link href="../assets/css/style.css" rel="stylesheet">
<meta name="description" content="Espace professeur : publier des cours, programmer les séances Google Meet.">
<link href="../forms/uwbfin.webp" rel="icon">
<link href="https://fonts.googleapis.com" rel="preconnect"><link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<link href="../assets/vendor/aos/aos.css" rel="stylesheet">
<link href="../assets/vendor/glightbox/css/glightbox.min.css" rel="stylesheet">
<link href="../assets/vendor/swiper/swiper-bundle.min.css" rel="stylesheet">
</head>
<body class="index-page">
<header id="header" class="header d-flex align-items-center sticky-top">
<div class="container position-relative d-flex align-items-center justify-content-between">
<a href="../index.html" class="logo d-flex align-items-center me-auto me-xl-0"><img src="../forms/uwbfin.webp" alt="UWB"></a>
<nav id="navmenu" class="navmenu"><ul>
<li><a href="dashboard.html"><i class="bi bi-speedometer2"></i> Mon espace</a></li>
<li><a href="mes-cours.html" class="active"><i class="bi bi-mortarboard"></i> Mes cours & Meet</a></li>
<li><a href="creer-evaluation.html"><i class="bi bi-journal-plus"></i> Créer une évaluation</a></li>
<li><a href="validation-ia.html"><i class="bi bi-robot"></i> Validation IA</a></li>
</ul><i class="mobile-nav-toggle d-xl-none bi bi-list"></i></nav>
<a class="btn-getstarted" href="#" onclick="uwbLogout();return false;">Déconnexion</a>
</div></header>
<main class="main">
<section class="section pt-4"><div class="container" data-aos="fade-up">
<div class="role-hero role-professeur" data-aos="fade-up" data-aos-delay="100">
<div class="d-flex align-items-center gap-3 flex-wrap">
<span class="role-avatar"><i class="bi bi-journals"></i></span>
<div><span class="hero-pill"><i class="bi bi-mortarboard"></i> Mes cours & séances Meet</span>
<h2 id="hero-nom">Mes cours</h2>
<p id="hero-meta" class="mb-0"></p></div>
<div class="ms-auto" id="hero-eval-btn"><a href="creer-evaluation.html" class="btn-uwb-gold text-decoration-none"><i class="bi bi-plus-circle"></i> Évaluation pour un cours</a></div>
</div></div>
<div class="stats-grid mt-4" id="kpi" data-aos="fade-up" data-aos-delay="150"></div>
</div></section>
<section class="portfolio section light-background">
<div class="container"><div class="d-flex justify-content-end mb-3" data-aos="fade-up"><button class="btn-uwb" onclick="new bootstrap.Modal(document.getElementById('coursModal')).show()"><i class="bi bi-plus-circle"></i> Ajouter un cours</button></div><div class="panel-pro" data-aos="fade-up"><div class="panel-head"><strong><i class="bi bi-collection"></i> Cours publiés</strong><small id="c-count"></small></div><div id="coursList"></div></div></div></section>
<div class="modal fade" id="coursModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content" style="border-radius:18px;overflow:hidden"><div class="p-3 p-md-4"><div class="d-flex justify-content-between align-items-center mb-2"><strong><i class="bi bi-plus-circle"></i> Nouveau cours</strong><button type="button" class="icon-btn danger" data-bs-dismiss="modal" aria-label="Fermer"><i class="bi bi-x-lg"></i></button></div><small class="text-muted d-block mb-2">Remplissez et publiez</small>
<form onsubmit="return addCours(event)" class="row g-3 form-min">
<div class="col-12"><label class="form-label">Titre *</label><input id="ct" class="form-control" placeholder="Ex : Algorithmes L1" required></div>
<div class="col-md-4"><label class="form-label">Catégorie *</label><input id="cc" class="form-control" value="Informatique" required></div>
<div class="col-md-4"><label class="form-label">Niveau</label><select id="cn" class="form-control"><option>L1</option><option>L2</option><option selected>L3</option><option>M1</option><option>M2</option><option>Autre</option></select></div>
<div class="col-md-4"><label class="form-label">Date séance</label><input id="cdt" class="form-control" placeholder="2026-10-07 10:00"></div>
<div class="col-md-6"><label class="form-label">Lien Google Meet</label><input id="cm" class="form-control" value="https://meet.google.com/uwb-"></div>
<div class="col-md-6"><label class="form-label">Description + supports ( ; )</label><input id="cd" class="form-control" placeholder="Intro… ; Support PDF ; TP.zip"></div>
<div class="col-12 d-flex gap-2"><button class="btn-uwb"><i class="bi bi-send"></i> Publier le cours</button><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fermer</button></div></form>
</div></div></div></div>
</main>
<footer id="footer" class="footer light-background"><div class="container footer-bottom"><div class="copyright"><p>© UWB E-learning — Mes cours. Design : <a href="https://bootstrapmade.com/">BootstrapMade (Orbit)</a>.</p></div></div></footer>
<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a><div id="preloader"></div>
<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/vendor/aos/aos.js"></script><script src="../assets/vendor/glightbox/js/glightbox.min.js"></script>
<script src="../assets/vendor/isotope-layout/isotope.pkgd.min.js"></script><script src="../assets/vendor/imagesloaded/imagesloaded.pkgd.min.js"></script>
<script src="../assets/vendor/purecounter/purecounter_vanilla.js"></script><script src="../assets/vendor/swiper/swiper-bundle.min.js"></script>
<script src="../assets/js/script.js"></script><script>
const s=uwbRequire(['professeur','admin']); let db=uwbLoad();
(function(el,v){if(el)el.innerHTML=v;})(document.getElementById('top-user'),'<i class="bi bi-person-circle"></i> '+s.nom);
document.getElementById('hero-nom').textContent='Mes cours, '+s.nom;
document.getElementById('hero-meta').textContent=s.filiere+' • '+s.email;
if(s.role==='admin'){document.getElementById('hero-eval-btn').style.display='none';document.querySelectorAll('#navmenu a').forEach(a=>{const h=a.getAttribute('href');if(h==='creer-evaluation.html'||h==='validation-ia.html'){const li=a.closest('li');if(li)li.remove();}});}
function myCourses(){db=uwbLoad();return s.role==='admin'?db.cours:db.cours.filter(c=>c.enseignant===s.nom);}
function renderAll(){const list=myCourses();const inscrits=list.reduce((a,c)=>a+(c.inscrits||0),0);
const kpis=[['bi-journals',list.length,'Cours publiés','stat-card-primary'],['bi-people',inscrits,'Étudiants inscrits',''],['bi-camera-video',list.filter(c=>c.seance&&c.seance.meet).length,'Séances Meet','stat-card-accent']];
document.getElementById('kpi').innerHTML=kpis.map(([ic,v,t,c],i)=>`<div class="stat-card ${c}" data-aos="zoom-in" data-aos-delay="${300+i*50}"><div class="stat-icon-wrap"><i class="bi ${ic}"></i></div><div class="stat-info"><span class="stat-value">${v}</span><span class="stat-title">${t}</span></div></div>`).join('');
document.getElementById('coursList').innerHTML=list.map(c=>`<div class="mini-row"><div style="min-width:0"><strong>${c.titre}</strong><br><small>${c.categorie} • ${c.niveau} • ${c.inscrits||0} inscrits • ${c.seance.date}</small><br><small class="text-truncate d-block">${c.seance.meet}</small></div><div class="mini-actions"><a class="icon-btn ok" title="Rejoindre le Meet" target="_blank" href="${c.seance.meet}"><i class="bi bi-camera-video"></i></a>${s.role!=='admin'?`<a class="icon-btn" title="Créer une évaluation" href="creer-evaluation.html"><i class="bi bi-plus-lg"></i></a>`:''}<button class="icon-btn danger" title="Supprimer" onclick="delCours('${c.id}')"><i class="bi bi-trash"></i></button></div></div>`).join('')||'<p class="text-muted small mb-0">Aucun cours. Publiez le premier ci-dessus.</p>';
document.getElementById('c-count').textContent=list.length+' cours';}
function addCours(e){e.preventDefault();const d=uwbLoad();d.cours.push({id:'c'+Date.now(),titre:document.getElementById('ct').value,enseignant:s.role==='admin'?'UWB':s.nom,categorie:document.getElementById('cc').value,niveau:document.getElementById('cn').value,description:document.getElementById('cd').value||'—',supports:(document.getElementById('cd').value||'').split(';').map(x=>x.trim()).filter(Boolean),seance:{date:document.getElementById('cdt').value||'À programmer',meet:document.getElementById('cm').value,salle:'Google Meet'},inscrits:0,image:'../forms/portfolio-1.webp'});uwbSave(d);location.reload();return false;}
function delCours(id){if(!confirm('Supprimer ce cours ?'))return;const d=uwbLoad();d.cours=d.cours.filter(c=>c.id!==id);uwbSave(d);location.reload();}
renderAll();
</script></body></html>
