<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — UWB Learn</title><link href="assets/css/style.css" rel="stylesheet"><link href="forms/uwbfin.webp" rel="icon">
<link href="https://fonts.googleapis.com" rel="preconnect"><link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"><link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<style>body{background:#f6f8fc}.auth-wrap{min-height:calc(100vh - 90px);display:flex;align-items:center;justify-content:center;padding:2rem 1rem}.auth-card{width:100%;max-width:480px}.auth-logo{width:64px;height:64px;object-fit:contain;border-radius:14px}</style>
</head>
<body>
<header id="header" class="header d-flex align-items-center sticky-top"><div class="container d-flex align-items-center justify-content-between">
<a href="index.html" class="logo d-flex align-items-center"><img src="forms/uwbfin.webp" alt="UWB"></a>
<div class="d-flex gap-2"><a class="btn-simple" href="inscription.html"><i class="bi bi-person-plus"></i> Créer un compte</a><a class="btn-simple" href="index.html"><i class="bi bi-house"></i> Accueil</a></div></div></header>
<main class="auth-wrap"><div class="auth-card">
<div class="panel-pro"><div class="text-center mb-2"><img src="forms/uwbfin.webp" alt="UWB" class="auth-logo"><div class="mt-2"><span class="mini-badge">Connexion par rôle</span></div><h2 class="mt-2 mb-0">Bon retour</h2><p class="text-muted small mb-0">Étudiant • Professeur • Admin</p></div>
<form onsubmit="return doLogin(event)" class="form-min mt-3"><div class="mb-2"><label class="form-label">Email</label><input id="email" type="email" class="form-control" value="etudiant@uwb.ac.cd" required></div>
<div class="mb-2"><label class="form-label">Mot de passe</label><div class="position-relative"><input id="pass" type="password" class="form-control pe-5" value="etu123" required><button type="button" class="icon-btn" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px" title="Voir / masquer" onclick="togglePass('pass',this)"><i class="bi bi-eye"></i></button></div></div>
<div id="err" class="alert alert-danger d-none py-2 small"></div>
<button class="btn-simple primary w-100 justify-content-center mt-2" type="submit">Se connecter <i class="bi bi-arrow-right"></i></button></form>
<hr><p class="small text-center mb-2">Pas de compte ? <a href="inscription.html" class="auth-link"><strong>Créer un compte</strong></a></p>
<div class="pro-row pro-tags justify-content-center"><span>Démo :</span><button type="button" class="pro-tag" onclick="fill('admin@uwb.ac.cd','admin123')">Admin</button><button type="button" class="pro-tag" onclick="fill('prof@uwb.ac.cd','prof123')">Prof</button><button type="button" class="pro-tag" onclick="fill('etudiant@uwb.ac.cd','etu123')">Étudiant</button></div>
</div></div></main>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script><script>function fill(e,p){document.getElementById('email').value=e;document.getElementById('pass').value=p;}
function togglePass(id,btn){const i=document.getElementById(id);const show=i.type==='password';i.type=show?'text':'password';btn.innerHTML=show?'<i class="bi bi-eye-slash"></i>':'<i class="bi bi-eye"></i>';}
(function(){try{const s=uwbSession();if(s){location.href=uwbHomeByRole(s.role);}}catch(e){}})();
function doLogin(ev){ev.preventDefault();const r=uwbLogin(document.getElementById('email').value.trim(),document.getElementById('pass').value);if(r.error){const d=document.getElementById('err');d.textContent=r.error;d.classList.remove('d-none');return false;}location.href=uwbHomeByRole(r.user.role);return false;}</script>
</body></html>
