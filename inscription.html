<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — UWB Learn</title><link href="assets/css/style.css" rel="stylesheet"><link href="forms/uwbfin.webp" rel="icon">
<link href="https://fonts.googleapis.com" rel="preconnect"><link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Raleway:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"><link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
<style>body{background:#f6f8fc}.auth-wrap{min-height:calc(100vh - 90px);display:flex;align-items:center;justify-content:center;padding:2rem 1rem}.auth-card{width:100%;max-width:560px}.auth-logo{width:64px;height:64px;object-fit:contain;border-radius:14px}.role-pick{display:flex;gap:.6rem}.role-pick label{flex:1;display:flex;gap:.5rem;align-items:center;border:1.5px solid #e5e9f2;border-radius:12px;padding:.6rem .8rem;cursor:pointer;font-size:.9rem;transition:.2s}.role-pick input{accent-color:#0a2a6b}.role-pick label:has(input:checked){border-color:#0a2a6b;background:#eef2ff}</style>
</head>
<body>
<header id="header" class="header d-flex align-items-center sticky-top"><div class="container d-flex align-items-center justify-content-between">
<a href="index.html" class="logo d-flex align-items-center"><img src="forms/uwbfin.webp" alt="UWB"></a>
<div class="d-flex gap-2"><a class="btn-simple" href="login.html"><i class="bi bi-box-arrow-in-right"></i> Se connecter</a><a class="btn-simple" href="index.html"><i class="bi bi-house"></i> Accueil</a></div></div></header>
<main class="auth-wrap"><div class="auth-card">
<div class="panel-pro"><div class="text-center mb-2"><img src="forms/uwbfin.webp" alt="UWB" class="auth-logo"><div class="mt-2"><span class="mini-badge">Création de compte</span></div><h2 class="mt-2 mb-0">Inscription</h2><p class="text-muted small mb-0">Étudiant ou professeur • 30 secondes</p></div>
<form onsubmit="return doRegister(event)" class="form-min mt-3">
<div class="row g-3"><div class="col-md-6"><label class="form-label">Nom complet *</label><input id="nom" class="form-control" placeholder="Ex : Divine Mbuyi" required></div>
<div class="col-md-6"><label class="form-label">Filière *</label><select id="fil" class="form-control" required></select></div>
<div class="col-md-6"><label class="form-label">Email académique *</label><input id="email" type="email" class="form-control" placeholder="vous@uwb.ac.cd" required></div>
<div class="col-md-6"><label class="form-label">Mot de passe *</label><div class="position-relative"><input id="pass" type="password" minlength="4" class="form-control pe-5" placeholder="Min. 4 caractères" required><button type="button" class="icon-btn" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px" title="Voir / masquer" onclick="togglePass('pass',this)"><i class="bi bi-eye"></i></button></div></div>
<div class="col-12"><label class="form-label">Je suis</label><div class="role-pick">
<label><input type="radio" name="role" value="etudiant" checked> <i class="bi bi-mortarboard-fill"></i> Étudiant</label>
<label><input type="radio" name="role" value="professeur"> <i class="bi bi-person-video3"></i> Professeur</label></div></div></div>
<div id="err" class="alert alert-danger d-none mt-2 py-2 small"></div>
<button class="btn-simple primary w-100 justify-content-center mt-3" type="submit">Créer mon compte <i class="bi bi-arrow-right"></i></button></form>
<hr><p class="small text-center mb-0">Déjà inscrit ? <a href="login.html" class="auth-link"><strong>Se connecter</strong></a></p>
</div></div></main>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/script.js"></script><script>function togglePass(id,btn){const i=document.getElementById(id);const show=i.type==='password';i.type=show?'text':'password';btn.innerHTML=show?'<i class="bi bi-eye-slash"></i>':'<i class="bi bi-eye"></i>';}
try{const _db=uwbLoad();const _fl=(_db.filieres||[]);document.getElementById('fil').innerHTML=_fl.length?_fl.map(f=>`<option value="${f.nom}">${f.nom} (${f.code||''})</option>`).join(''):'<option value="—">— Aucune filière —</option>';}catch(e){}
function doRegister(ev){ev.preventDefault();const role=document.querySelector('input[name=role]:checked').value;
const r=uwbRegister(document.getElementById('nom').value.trim(),document.getElementById('email').value.trim(),document.getElementById('pass').value,role,document.getElementById('fil').value.trim());
if(r.error){const d=document.getElementById('err');d.textContent=r.error;d.classList.remove('d-none');return false;}
alert('Bienvenue '+r.user.nom+' ! Espace '+r.user.role+'.');location.href=uwbHomeByRole(r.user.role);return false;}</script>
</body></html>
